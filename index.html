.metric-card{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:16px 20px}

.section-title{font-size:12px;font-weight:700;color:#718096;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

<body>

<!-- 頂部管理列 -->
<div id="adminBar">
  <span class="ab-label">公信電子 GHG 盤查系統</span>
  <span id="adminBadge" class="ab-badge" style="display:none">🔐 管理者</span>
  <button id="adminLoginBtn" class="ab-btn ab-login" onclick="openLoginModal()">🔒 管理者登入</button>
  <button id="adminLogoutBtn" class="ab-btn ab-logout" style="display:none" onclick="doLogout()">登出</button>
</div>

<!-- 登入 Modal -->
<div id="loginModal" class="hidden">
  <div class="lm-box">
    <div class="lm-title">🔐 管理者登入</div>
    <input id="pwInput" class="lm-input" type="password" placeholder="請輸入管理密碼" maxlength="20"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="lm-btn" onclick="doLogin()">登入</button>
    <div class="lm-err" id="loginErr"></div>
    <br><button class="lm-cancel" onclick="closeLoginModal()">取消</button>
  </div>
</div>

<script>
(function(){
  const PW='ji394su3';
  const SK='ghg_admin';
  let isAdmin=sessionStorage.getItem(SK)==='1';

  function applyAdminState(){
    document.getElementById('adminBadge').style.display=isAdmin?'inline-block':'none';
    document.getElementById('adminLoginBtn').style.display=isAdmin?'none':'inline-block';
    document.getElementById('adminLogoutBtn').style.display=isAdmin?'inline-block':'none';
    if(isAdmin){document.body.classList.remove('readonly');}
    else{document.body.classList.add('readonly');}
  }

  function openLoginModal(){
    document.getElementById('loginModal').classList.remove('hidden');
    document.getElementById('loginErr').textContent='';
    document.getElementById('pwInput').value='';
    setTimeout(()=>document.getElementById('pwInput').focus(),80);
  }
  function closeLoginModal(){
    document.getElementById('loginModal').classList.add('hidden');
  }
  function doLogin(){
    const v=document.getElementById('pwInput').value;
    if(v===PW){
      isAdmin=true;
      sessionStorage.setItem(SK,'1');
      closeLoginModal();
      applyAdminState();
      if(window.renderMain)window.renderMain();
    }else{
      document.getElementById('loginErr').textContent='密碼錯誤，請再試一次';
      document.getElementById('pwInput').value='';
      document.getElementById('pwInput').focus();
    }
  }
  function doLogout(){
    isAdmin=false;
    sessionStorage.removeItem(SK);
    applyAdminState();
    if(window.renderMain)window.renderMain();
  }

  window.doLogin=doLogin;
  window.doLogout=doLogout;
  window.openLoginModal=openLoginModal;
  window.closeLoginModal=closeLoginModal;
  window.isAdmin=()=>isAdmin;

  // 點 Modal 背景關閉
  document.getElementById('loginModal').addEventListener('click',function(e){
    if(e.target===this)closeLoginModal();
  });

  applyAdminState();
})();
</script>

function loadRec(){try{const s=localStorage.getItem(REC_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEMO.records));}catch{return JSON.parse(JSON.stringify(DEMO.records));}}
function loadCoeff(){try{const s=localStorage.getItem(COEFF_KEY);return s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_COEFF));}catch{return JSON.parse(JSON.stringify(DEFAULT_COEFF));}}
function saveRec(r){try{localStorage.setItem(REC_KEY,JSON.stringify(r));}catch{}}
function saveCoeff(c){try{localStorage.setItem(COEFF_KEY,JSON.stringify(c));}catch{}}

let REC=loadRec(), COEFF=loadCoeff();
let currentTab='dashboard', currentYear=2025, currentMonth=1, currentSite='all';

function getElecFactor(year){return(COEFF.electricity.find(e=>e.year===year)||COEFF.electricity[0]).factor;}
function calcElec(kwh,year){return+(kwh*getElecFactor(year)/1000).toFixed(6);}
function calcRefrig(kg,leakRate,gwp){if(!gwp)return null;return+(kg*gwp*leakRate/1000).toFixed(6);}
function calcFuel(amount,price){if(!price||price<=0)return 0;const f=COEFF.fuel.gasoline92,L=amount/price;return+((L*f.co2+L*f.ch4*f.gwp_ch4+L*f.n2o*f.gwp_n2o)/1000).toFixed(6);}
function calcSeptic(male,female,workDays,hoursPerDay){const cfg=COEFF.septicTank,ph=(male+female)*hoursPerDay*workDays,act=(ph/cfg.daily_hours)*cfg.bod_per_person_day;return+(act*cfg.bo*cfg.mcf*cfg.gwp_ch4).toFixed(6);}

function recalcYear(year){
  const yr=String(year);
  if(!REC[yr])return;
  Object.keys(REC[yr]).forEach(mo=>{
    const m=REC[yr][mo];
    (m.electricity||[]).forEach(r=>{r.emission=calcElec(r.kwh,year);});
    (m.refrigerant||[]).forEach(r=>{r.emission=calcRefrig(r.kg,r.leakRate,r.gwp);});
    (m.fuel||[]).forEach(r=>{r.emission=calcFuel(r.amount,r.pricePerLiter);});
    (m.septicTank||[]).forEach(r=>{r.emission=calcSeptic(r.male,r.female,r.workDays,r.hoursPerDay);});
  });
}
recalcYear(currentYear);

function getSummary(year,site='all'){
  const yr=String(year);
  const empty=Array.from({length:12},(_,i)=>({month:i+1,cat1:0,cat2:0,refrigerant:0,fuel:0,septic:0}));
  if(!REC[yr])return{months:empty,total:{cat1:0,cat2:0}};
  const months=[];
  for(let m=1;m<=12;m++){
    const md=REC[yr][String(m)];
    if(!md){months.push({month:m,cat1:0,cat2:0,refrigerant:0,fuel:0,septic:0});continue;}
    const fs=r=>site==='all'||r.site===site;
    const cat2=(md.electricity||[]).filter(fs).reduce((s,r)=>s+(r.emission||0),0);
    const refrigerant=(md.refrigerant||[]).filter(fs).reduce((s,r)=>s+(r.emission||0),0);
    const fuel=(md.fuel||[]).filter(fs).reduce((s,r)=>s+(r.emission||0),0);
    const septic=(md.septicTank||[]).filter(fs).reduce((s,r)=>s+(r.emission||0),0);
    months.push({month:m,cat2,refrigerant,fuel,septic,cat1:refrigerant+fuel+septic});
  }
  const total=months.reduce((a,m)=>({cat1:a.cat1+m.cat1,cat2:a.cat2+m.cat2}),{cat1:0,cat2:0});
  return{months,total};
}
function getBreakdown(year){
  const yr=String(year);
  if(!REC[yr])return[];
  return['汐止','南港'].map(site=>{
    let cat1=0,cat2=0;
    Object.values(REC[yr]).forEach(md=>{
      cat2+=(md.electricity||[]).filter(r=>r.site===site).reduce((s,r)=>s+(r.emission||0),0);
      cat1+=[...(md.refrigerant||[]),...(md.fuel||[]),...(md.septicTank||[])].filter(r=>r.site===site).reduce((s,r)=>s+(r.emission||0),0);
    });
    return{site,cat1:+cat1.toFixed(4),cat2:+cat2.toFixed(4),total:+(cat1+cat2).toFixed(4)};
  });
}

function drawBarChart(canvasId,data){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const pad={top:20,right:10,bottom:30,left:48};
  const chartW=W-pad.left-pad.right,chartH=H-pad.top-pad.bottom;
  ctx.clearRect(0,0,W,H);

  const maxVal=Math.max(...data.map(d=>d.cat1+d.cat2),0.001);
  const barW=chartW/data.length;

  // Grid
  ctx.strokeStyle='#f0f0f0';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.top+chartH*(1-i/4);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+chartW,y);ctx.stroke();
    ctx.fillStyle='#718096';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText(fmt(maxVal*i/4,3),pad.left-4,y+3);
  }

  data.forEach((d,i)=>{
    const x=pad.left+i*barW+barW*0.1;
    const bw=barW*0.8;
    const h1=d.cat1/maxVal*chartH;
    const h2=d.cat2/maxVal*chartH;

    // cat1 (bottom)
    if(h1>0){ctx.fillStyle='#0F6E56';ctx.fillRect(x,pad.top+chartH-h1,bw,h1);}
    // cat2 (top)
    if(h2>0){ctx.fillStyle='#185FA5';ctx.fillRect(x,pad.top+chartH-h1-h2,bw,h2);}

    // x label
    ctx.fillStyle='#718096';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(d.name,pad.left+i*barW+barW/2,H-8);
  });

  // Legend
  [['類別一',`#0F6E56`],['類別二','#185FA5']].forEach(([name,color],i)=>{
    ctx.fillStyle=color;ctx.fillRect(W-120+i*58,6,12,10);
    ctx.fillStyle='#718096';ctx.font='10px sans-serif';ctx.textAlign='left';
    ctx.fillText(name,W-106+i*58,15);
  });
}

function drawPieChart(canvasId,data){
  const canvas=document.getElementById(canvasId);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const total=data.reduce((s,d)=>s+d.value,0);
  if(total<=0){ctx.fillStyle='#718096';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('尚無資料',W/2,H/2);return;}

  const cx=W/2-30,cy=H/2,r=Math.min(cx,cy)-20;
  let startAngle=-Math.PI/2;
  data.forEach(d=>{
    const slice=d.value/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,startAngle,startAngle+slice);
    ctx.closePath();ctx.fillStyle=d.color;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    startAngle+=slice;
  });

  // Legend
  const lx=W-90,ly=H/2-data.length*12;
  data.forEach((d,i)=>{
    ctx.fillStyle=d.color;ctx.fillRect(lx,ly+i*22,12,12);
    ctx.fillStyle='#1a202c';ctx.font='11px sans-serif';ctx.textAlign='left';
    ctx.fillText(d.name,lx+16,ly+i*22+10);
    ctx.fillStyle='#718096';
    ctx.fillText(`${(d.value/total*100).toFixed(0)}%`,lx+16,ly+i*22+21);
  });
}

function yearSel(val,onchange){
  return`<select onchange="${onchange}" style="border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff">${[2023,2024,2025,2026].map(y=>`<option value="${y}"${val==y?' selected':''}>${y}年</option>`).join('')}</select>`;
}
function monthSel(val,onchange){
  return`<select onchange="${onchange}" style="border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${val==i+1?' selected':''}>${i+1}月</option>`).join('')}</select>`;
}
function siteSel(val,onchange){
  return`<select onchange="${onchange}" style="border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff"><option value="all"${val==='all'?' selected':''}>全場域</option><option value="汐止"${val==='汐止'?' selected':''}>汐止</option><option value="南港"${val==='南港'?' selected':''}>南港</option></select>`;
}
function metricCard(label,value,unit,color){
  return`<div class="metric-card"><div class="metric-label">${label}</div><div class="metric-value" style="color:${color}">${value}</div><div class="metric-unit">${unit}</div></div>`;
}

// ── Dashboard ──
function pageDashboard(){
  recalcYear(currentYear);
  const sum=getSummary(currentYear,currentSite);
  const bd=getBreakdown(currentYear);
  const total=+(sum.total.cat1+sum.total.cat2).toFixed(4);
  const filledMonths=Object.keys(REC[String(currentYear)]||{}).length;
  const MONTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  const pieData=[
    {name:'外購電力',value:+sum.total.cat2.toFixed(4),color:'#185FA5'},
    {name:'冷媒逸散',value:+sum.months.reduce((s,m)=>s+(m.refrigerant||0),0).toFixed(4),color:'#854F0B'},
    {name:'移動源',value:+sum.months.reduce((s,m)=>s+(m.fuel||0),0).toFixed(4),color:'#993556'},
    {name:'化糞池',value:+sum.months.reduce((s,m)=>s+(m.septic||0),0).toFixed(4),color:'#533AB7'},
  ].filter(d=>d.value>0);

  const breakdownRows=bd.map(r=>`
    <tr>
      <td style="font-weight:600">${r.site}</td>
      <td style="color:#0F6E56">${r.cat1.toFixed(4)}</td>
      <td style="color:#185FA5">${r.cat2.toFixed(4)}</td>
      <td style="font-weight:600">${r.total.toFixed(4)}</td>
      <td>${total>0?`<div style="display:flex;align-items:center;gap:8px"><div class="prog-bar"><div class="prog-fill" style="width:${(r.total/total*100).toFixed(1)}%"></div></div><span style="font-size:12px;font-weight:600;color:#0F6E56;min-width:36px">${(r.total/total*100).toFixed(1)}%</span></div>`:'-'}</td>
    </tr>`).join('');

  document.getElementById('main').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">溫室氣體排放總覽</div><div class="page-sub">依 ISO 14064-1 盤查邊界彙整</div></div>
      <div class="header-controls">
        ${yearSel(currentYear,"setYear(this.value)")}
        ${siteSel(currentSite,"setSite(this.value)")}
      </div>
    </div>
    <div class="metric-grid">
      ${metricCard('年度總排放',total.toFixed(3),'公噸 CO₂e','#0F6E56')}
      ${metricCard('類別一 直接排放',sum.total.cat1.toFixed(3),'公噸 CO₂e','#0F6E56')}
      ${metricCard('類別二 外購電力',sum.total.cat2.toFixed(3),'公噸 CO₂e','#185FA5')}
      ${metricCard('已填報月份',filledMonths,'/ 12 個月','#854F0B')}
    </div>
    <div class="two-col">
      <div class="card">
        <div class="section-title">月排放量趨勢（公噸 CO₂e）</div>
        <canvas id="barChart" width="600" height="220"></canvas>
      </div>
      <div class="card">
        <div class="section-title">排放來源占比</div>
        <canvas id="pieChart" width="280" height="220"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="section-title">場域排放比較</div>
      <table>
        <thead><tr><th>場域</th><th>類別一 (公噸CO₂e)</th><th>類別二 (公噸CO₂e)</th><th>合計 (公噸CO₂e)</th><th>佔比</th></tr></thead>
        <tbody>${breakdownRows}</tbody>
      </table>
    </div>`;

  const chartData=sum.months.map((m,i)=>({name:MONTHS[i],cat1:+(m.cat1||0).toFixed(4),cat2:+(m.cat2||0).toFixed(4)}));
  drawBarChart('barChart',chartData);
  drawPieChart('pieChart',pieData);
}

// ── Elec Entry ──

  const totalKwh=existing.reduce((s,r)=>s+r.kwh,0);
  const totalEmit=existing.reduce((s,r)=>s+(r.emission||0),0);

  const rows=existing.map(r=>`
    <tr>
      <td>${badge(r.site,'#185FA5')}</td>

      <td style="font-weight:600;color:#185FA5">${fmt(r.emission)}</td>

      <div class="header-controls">${yearSel(currentYear,"setYear(this.value)")}${monthSel(currentMonth,"setMonth(this.value)")}</div>
    </div>
    <div class="metric-grid" style="grid-template-columns:1fr 1fr">
      ${metricCard('本月總用電量',totalKwh.toFixed(0),'度','#185FA5')}
      ${metricCard('本月排放量',totalEmit.toFixed(4),'公噸 CO₂e','#185FA5')}
    </div>
    <div class="card">
      <div class="section-title">新增帳單紀錄</div>
      <div class="form-row">
        <div class="form-group"><div class="form-label">場域</div><select id="ef-site" style="min-width:70px"><option>汐止</option><option>南港</option></select></div>
        <div class="form-group flex1"><div class="form-label">電號</div><input id="ef-meter" placeholder="電號"></div>
        <div class="form-group"><div class="form-label">度數</div><input id="ef-kwh" type="number" placeholder="度" style="width:90px"></div>
        <div class="form-group"><div class="form-label">金額(元)</div><input id="ef-amt" type="number" placeholder="元" style="width:100px"></div>
        <div class="form-group"><div class="form-label">起始日</div><input id="ef-s" type="date" style="width:135px"></div>

        <div class="form-group" style="justify-content:flex-end"><button class="btn btn-primary" onclick="addElec()">新增</button></div>
      </div>
      <button class="btn btn-ghost" onclick="toggleImportBox()" style="margin-top:8px">📋 貼上 Excel 資料批次匯入</button>
      <div id="importBox" style="display:none;margin-top:12px">
        <div class="form-label" style="margin-bottom:6px">格式：場域、電號、度數、金額、起始日、結束日（Tab 或逗號分隔）</div>
        <textarea id="importText" rows="4" style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:10px;font-size:12px;font-family:monospace" placeholder="汐止&#9;2935001313&#9;1073&#9;2678&#9;2025-01-01&#9;2025-03-01"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">

      <div class="section-title">本月電力紀錄 (${existing.length} 筆)</div>
      ${existing.length===0?'<div class="empty">尚無紀錄，請填寫上方表單</div>':
      `<div style="overflow-x:auto"><table>
        <thead><tr><th>場域</th><th>電號</th><th>度數</th><th>金額(元)</th><th>帳單期間</th><th>排放量 CO₂e</th><th></th></tr></thead>

  }
  else if(coeffSub==='fuel'){
    const f=COEFF.fuel.gasoline92;
    const fields=[['co2','CO₂ 排放係數 (kgCO₂/L)'],['ch4','CH₄ 排放係數 (kgCH₄/L)'],['n2o','N₂O 排放係數 (kgN₂O/L)'],['gwp_ch4','CH₄ GWP 值 (AR6)'],['gwp_n2o','N₂O GWP 值 (AR6)']];

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        ${fields.map(([k,label])=>`
          <div>
            <div class="form-label" style="margin-bottom:6px">${label}</div>
            <input type="number" step="0.000001" value="${f[k]}" style="border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;width:100%" onchange="updateFuelCoeff('${k}',this.value)">
          </div>`).join('')}
      </div></div>`;
  }
  else{
    const cfg=COEFF.septicTank;
    const fields=[['bo','Bo（BOD 最大 CH₄ 產生能力）'],['mcf','MCF（CH₄ 修正係數）'],['gwp_ch4','CH₄ GWP 值 (AR6)'],['bod_per_person_day','每人每日 BOD（公噸）'],['daily_hours','每日工時（小時）']];
    el.innerHTML=`<div class="card"><div class="section-title">化糞池排放係數</div>

          </div>`).join('')}
      </div>
      <div class="info-box">
        <strong>計算公式：</strong>人時 = 總人數 × 每日工時 × 工作天數<br>
        排放量 = (人時 ÷ 每日工時 × BOD/人日) × Bo × MCF × GWP(CH₄)
      </div>
    </div>`;
  }
}

function setYear(v){currentYear=+v;recalcYear(currentYear);renderMain();}
function setMonth(v){currentMonth=+v;renderMain();}
function setSite(v){currentSite=v;renderMain();}
function setCat1Sub(s){cat1Sub=s;pageCat1();}
function setCoeffSub(s){coeffSub=s;renderCoeffSub();}
function setImportType(t){importFileType=t;renderImportStep('select');}
function setImportYear(v){importYear=+v;}
function resetImport(){importPreview=null;importFileType=null;renderImportStep('select');}

function ensurePath(yr,mo){
  if(!REC[yr])REC[yr]={};
  if(!REC[yr][mo])REC[yr][mo]={electricity:[],refrigerant:[],fuel:[],septicTank:[]};
}

// Elec
function toggleImportBox(){const b=document.getElementById('importBox');if(b)b.style.display=b.style.display==='none'?'block':'none';}
function addElec(){
  const meter=document.getElementById('ef-meter')?.value?.trim();
  const kwh=parseFloat(document.getElementById('ef-kwh')?.value);
  if(!meter||!kwh)return;
  const yr=String(currentYear),mo=String(currentMonth);
  ensurePath(yr,mo);
  REC[yr][mo].electricity.push({
    id:Date.now().toString(),
    site:document.getElementById('ef-site').value,
    meter,kwh,
    amount:parseFloat(document.getElementById('ef-amt')?.value)||0,
    startDate:document.getElementById('ef-s')?.value||'',
    endDate:document.getElementById('ef-e')?.value||'',
    emission:calcElec(kwh,currentYear)
  });
  saveRec(REC);toast('已新增電力紀錄');pageElec();
}
function delElec(id){
  const yr=String(currentYear),mo=String(currentMonth);
  if(REC[yr]?.[mo]?.electricity)REC[yr][mo].electricity=REC[yr][mo].electricity.filter(r=>r.id!==id);
  saveRec(REC);toast('已刪除','info');pageElec();
}
function batchImportElec(){
  const text=document.getElementById('importText')?.value;if(!text)return;
  const lines=text.trim().split('\n').filter(l=>l.trim());
  const parsed=lines.map(line=>{
    const pts=line.split(/[\t,]/);if(pts.length<3)return null;
    const kwh=parseFloat(pts[2])||0;
    return{id:Date.now()+Math.random(),site:pts[0]?.trim()||'汐止',meter:pts[1]?.trim()||'',kwh,amount:parseFloat(pts[3])||0,startDate:pts[4]?.trim()||'',endDate:pts[5]?.trim()||'',emission:calcElec(kwh,currentYear)};
  }).filter(Boolean);
  if(!parsed.length){toast('格式錯誤','error');return;}
  const yr=String(currentYear),mo=String(currentMonth);
  ensurePath(yr,mo);
  REC[yr][mo].electricity=[...REC[yr][mo].electricity,...parsed];
  saveRec(REC);toast(`已匯入 ${parsed.length} 筆`);pageElec();
}

// Cat1
function syncGwp(){
  const sub=document.getElementById('rf-sub')?.value;
  const found=COEFF.refrigerants.find(r=>r.name===sub);
  const gwpEl=document.getElementById('rf-gwp');
  if(gwpEl&&found?.gwp)gwpEl.value=found.gwp;
}
function addRefrig(){
  const kg=parseFloat(document.getElementById('rf-kg')?.value);if(!kg)return;
  const yr=String(currentYear),mo=String(currentMonth);
  ensurePath(yr,mo);
  const gwp=parseFloat(document.getElementById('rf-gwp')?.value)||null;
  const leakRate=parseFloat(document.getElementById('rf-lr')?.value)||0.003;
  REC[yr][mo].refrigerant.push({id:Date.now().toString(),site:document.getElementById('rf-site').value,device:document.getElementById('rf-dev')?.value||'',substance:document.getElementById('rf-sub')?.value||'',kg,gwp,leakRate,emission:calcRefrig(kg,leakRate,gwp)});
  saveRec(REC);toast('已新增冷媒紀錄');renderCat1Sub();
}
function addFuelRec(){
  const amt=parseFloat(document.getElementById('ff-amt')?.value);
  const price=parseFloat(document.getElementById('ff-price')?.value);
  if(!amt||!price)return;
  const yr=String(currentYear),mo=String(currentMonth);
  ensurePath(yr,mo);
  REC[yr][mo].fuel.push({id:Date.now().toString(),site:document.getElementById('ff-site').value,vehicle:document.getElementById('ff-veh')?.value||'',fuelType:document.getElementById('ff-ft')?.value||'車用汽油(92)',amount:amt,pricePerLiter:price,emission:calcFuel(amt,price)});
  saveRec(REC);toast('已新增移動源紀錄');renderCat1Sub();
}
function addSepticRec(){
  const male=parseInt(document.getElementById('sf-m')?.value)||0;
  const workDays=parseInt(document.getElementById('sf-d')?.value);
  if(!workDays)return;
  const yr=String(currentYear),mo=String(currentMonth);
  ensurePath(yr,mo);
  const female=parseInt(document.getElementById('sf-f')?.value)||0;
  const hoursPerDay=parseInt(document.getElementById('sf-h')?.value)||8;
  REC[yr][mo].septicTank.push({id:Date.now().toString(),site:document.getElementById('sf-site').value,male,female,workDays,hoursPerDay,emission:calcSeptic(male,female,workDays,hoursPerDay)});
  saveRec(REC);toast('已新增化糞池紀錄');renderCat1Sub();
}
function delCat1(type,id){
  const yr=String(currentYear),mo=String(currentMonth);
  if(REC[yr]?.[mo]?.[type])REC[yr][mo][type]=REC[yr][mo][type].filter(r=>r.id!==id);
  saveRec(REC);toast('已刪除','info');renderCat1Sub();
}

// Coefficients
function updateElecFactor(i,v){COEFF.electricity[i].factor=+v;saveCoeff(COEFF);}
function delElecRow(i){COEFF.electricity=COEFF.electricity.filter((_,j)=>j!==i);saveCoeff(COEFF);renderCoeffSub();}
function addElecRow(){
  const yr=+document.getElementById('ne-yr')?.value;
  const fac=parseFloat(document.getElementById('ne-fac')?.value);
  if(!fac)return;
  COEFF.electricity.push({year:yr,factor:fac,note:document.getElementById('ne-note')?.value||''});
  saveCoeff(COEFF);renderCoeffSub();toast('已新增電力係數');
}
function delRefrigRow(i){COEFF.refrigerants=COEFF.refrigerants.filter((_,j)=>j!==i);saveCoeff(COEFF);renderCoeffSub();}
function addRefrigRow(){
  const name=document.getElementById('nr-name')?.value?.trim();if(!name)return;
  const gwp=document.getElementById('nr-gwp')?.value;
  COEFF.refrigerants.push({name,gwp:gwp?+gwp:null,ar:document.getElementById('nr-ar')?.value||'AR6'});
  saveCoeff(COEFF);renderCoeffSub();toast('已新增冷媒');
}
function updateFuelCoeff(k,v){COEFF.fuel.gasoline92[k]=+v;saveCoeff(COEFF);}
function updateSepticCoeff(k,v){COEFF.septicTank[k]=+v;saveCoeff(COEFF);}
function recomputeAll(){
  recalcYear(currentYear);saveRec(REC);
  toast('排放量已根據最新係數重新計算');
}

// Report - CSV export
function exportCSV(){
  recalcYear(currentYear);
  const sum=getSummary(currentYear);
  const rows=[['月份','類別一 直接排放(公噸CO₂e)','類別二 外購電力(公噸CO₂e)','合計(公噸CO₂e)']];
  sum.months.forEach((m,i)=>rows.push([`${i+1}月`,m.cat1.toFixed(6),m.cat2.toFixed(6),(m.cat1+m.cat2).toFixed(6)]));
  const total=+(sum.total.cat1+sum.total.cat2).toFixed(6);
  rows.push(['合計',sum.total.cat1.toFixed(6),sum.total.cat2.toFixed(6),total]);
  const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`GHG_${currentYear}_彙整表.csv`;a.click();
  toast('CSV 已下載');
}

// Excel import
function handleXlsxFile(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('import-status');
  if(status)status.textContent='解析中⋯';
  if(typeof XLSX==='undefined'){
    if(status)status.innerHTML='<span style="color:#C53030">⚠️ 請連接網路後重新開啟，XLSX 解析套件需要網路載入一次</span>';
    return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      if(importFileType==='elec')parseElecXlsx(wb);
      else parseCat1Xlsx(wb);
    }catch(err){
      if(status)status.innerHTML=`<span style="color:#C53030">⚠️ 解析失敗：${esc(err.message)}</span>`;
    }
  };
  reader.readAsArrayBuffer(file);
}
function excelDateToISO(serial){
  if(!serial||isNaN(serial))return'';
  return new Date((serial-25569)*86400*1000).toISOString().slice(0,10);
}
function inferSite(name){
  const s=String(name||'');
  if(s.includes('南港'))return'南港';
  return'汐止';
}
function dateToMonth(iso){return iso&&iso.length>=7?parseInt(iso.slice(5,7)):null;}

function parseElecXlsx(wb){
  const rows=[];
  const skip=['表單使用說明','說明','使用說明'];
  wb.SheetNames.forEach(name=>{
    if(skip.some(s=>name.includes(s)))return;
    const data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null});
    const site=inferSite(name);
    data.forEach((row,ri)=>{
      if(!row||!row[0])return;
      const meter=String(row[0]).trim();
      if(!/^\d{8,}/.test(meter))return;
      const kwh=parseFloat(row[5]);
      if(!kwh||isNaN(kwh)||kwh<=0)return;
      const startDate=excelDateToISO(row[2]),endDate=excelDateToISO(row[3]);
      rows.push({id:`imp_e_${Date.now()}_${ri}`,site,meter,kwh,amount:parseFloat(row[6])||0,startDate,endDate,month:dateToMonth(startDate)||1,emission:null});
    });
  });
  if(!rows.length){document.getElementById('import-status').innerHTML='<span style="color:#C53030">⚠️ 未找到有效電力帳單資料</span>';return;}
  importPreview={type:'elec',rows};
  renderImportStep('preview');
}
function parseCat1Xlsx(wb){
  const result={refrigerant:[],fuel:[],septic:[]};
  wb.SheetNames.forEach(name=>{
    const data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null});
    if(name.includes('冷媒')){
      data.forEach((row,ri)=>{
        if(!row||ri===0)return;
        const site=String(row[0]||'').trim();
        if(!['汐止','南港','林口'].includes(site))return;
        const kg=parseFloat(row[5]);if(isNaN(kg)||kg<=0)return;
        result.refrigerant.push({id:`imp_r_${Date.now()}_${ri}`,site,device:String(row[2]||''),substance:String(row[4]||''),kg,gwp:row[8]==='未公告'||!row[8]?null:parseFloat(row[8]),leakRate:parseFloat(row[9])||0.003,emission:null});
      });
    }
    if(name.includes('移動源')){
      data.forEach((row,ri)=>{
        if(!row||ri===0)return;
        const vehicle=String(row[0]||'').trim();
        if(!vehicle||vehicle.includes('排放源'))return;
        const amount=parseFloat(row[3]);if(isNaN(amount)||amount<=0)return;
        result.fuel.push({id:`imp_f_${Date.now()}_${ri}`,site:'南港',vehicle,fuelType:String(row[1]||'車用汽油(92)'),amount,pricePerLiter:parseFloat(row[4])||0,month:dateToMonth(excelDateToISO(row[2]))||1,emission:null});
      });
    }
    if(name.includes('化糞池碳排')){
      let currentSite='汐止';
      data.forEach((row,ri)=>{
        if(!row)return;
        if(row[0]==='汐止'||row[0]==='南港')currentSite=row[0];
        const month=parseInt(row[1]),workDays=parseInt(row[2]);
        if(!month||isNaN(workDays)||workDays<=0)return;
        const male=parseInt(row[4])||0,female=parseInt(row[5])||0;
        if(!male&&!female)return;
        result.septic.push({id:`imp_s_${Date.now()}_${ri}`,site:currentSite,month,workDays,hoursPerDay:parseInt(row[3])||8,male,female,emission:null});
      });
    }
  });
  if(!result.refrigerant.length&&!result.fuel.length&&!result.septic.length){
    document.getElementById('import-status').innerHTML='<span style="color:#C53030">⚠️ 未找到有效資料，請確認是類別一直接排放檔案</span>';return;
  }
  importPreview={type:'cat1',...result};
  renderImportStep('preview');
}
function commitImport(){
  if(!importPreview)return;
  const yr=String(importYear);
  if(!REC[yr])REC[yr]={};
  const ensure=m=>{const ms=String(m);if(!REC[yr][ms])REC[yr][ms]={electricity:[],refrigerant:[],fuel:[],septicTank:[]};};
  if(importPreview.type==='elec'){
    importPreview.rows.forEach(r=>{ensure(r.month);REC[yr][String(r.month)].electricity.push({...r,emission:calcElec(r.kwh,importYear)});});
  }else{
    importPreview.refrigerant.forEach(r=>{ensure(1);REC[yr]['1'].refrigerant.push(r);});
    importPreview.fuel.forEach(r=>{ensure(r.month);REC[yr][String(r.month)].fuel.push(r);});
    importPreview.septic.forEach(r=>{ensure(r.month);REC[yr][String(r.month)].septicTank.push(r);});
  }
  saveRec(REC);toast('✅ 資料已成功匯入');renderImportStep('done');
}

// ── 處理檔案 ──
async function handleFiles(files){
  if(!files||!files.length)return;
  const key=localStorage.getItem('ghg_api_key')||'';
  if(!key){alert('請先填入 Anthropic API Key');return;}
  const billType=document.getElementById('scanBillType')?.value||'auto';

  for(const file of Array.from(files)){
    const id='bill_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const bill={id,fileName:file.name,status:'parsing',imageBase64:null,parsed:null,createdAt:new Date().toLocaleString('zh-TW')};
    BILLS.unshift(bill);saveBills(BILLS);renderBillList();

    try{
      // 轉 base64
      const b64=await fileToBase64(file);
      bill.imageBase64=b64;

      // 呼叫 Claude API
      const result=await callClaudeVision(b64, file.type, billType, key);
      bill.parsed=result;
      bill.status='pending';
    }catch(err){
      bill.status='error';
      bill.errorMsg=err.message;
    }
    saveBills(BILLS);renderBillList();
  }
}

async function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    // PDF：只能當 image/jpeg 傳（先 canvas 渲染），簡化處理：直接傳 base64
    const reader=new FileReader();
    reader.onload=e=>{
      const result=e.target.result; // data:image/...;base64,...
      resolve(result); // 保留完整 data URI
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function callClaudeVision(dataUri, mimeType, billType, apiKey){
  // 從 data URI 拆出 base64 部分和 mediaType
  const match=dataUri.match(/^data:([^;]+);base64,(.+)$/);
  if(!match)throw new Error('無法解析圖片格式');
  const mediaType=match[1];
  const base64Data=match[2];

  // PDF 用 document type，圖片用 image type
  const isPdf=mediaType==='application/pdf';

  const typeHint=billType==='auto'?'請自動判斷是電費單還是水費單':billType==='electricity'?'這是電費單':'這是水費單';

  const prompt=`請分析這份台灣公用事業帳單（${typeHint}），提取以下資訊並只回傳 JSON，不要任何說明文字：

{
  "billType": "electricity" 或 "water",
  "site": "場域名稱（如汐止、南港，從地址判斷）",
  "meter": "電號或水號",
  "startDate": "YYYY-MM-DD",
  "endDate": "YYYY-MM-DD",
  "period": "帳單期間說明",
  "kwh": 用電度數（數字，電費單用）,
  "usage": 用水度數（數字，水費單用）,
  "amount": 應繳金額（數字，不含單位）,
  "address": "用電/用水地址",
  "note": "其他備註（如跨期說明）"
}

如果某欄位讀不到，填 null。金額只取數字不含逗號。`;

  const contentBlock=isPdf
    ?{type:'document',source:{type:'base64',media_type:mediaType,data:base64Data}}
    :{type:'image',source:{type:'base64',media_type:mediaType,data:base64Data}};

  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user',content:[contentBlock,{type:'text',text:prompt}]}]
    })
  });

  if(!resp.ok){
    const err=await resp.json().catch(()=>({}));
    throw new Error(err.error?.message||`API 錯誤 ${resp.status}`);
  }

  const data=await resp.json();
  const text=data.content?.find(c=>c.type==='text')?.text||'';
  // 解析 JSON（去除 markdown code fence）
  const clean=text.replace(/```json|```/g,'').trim();
  try{return JSON.parse(clean);}
  catch{throw new Error('AI 回傳格式異常：'+text.slice(0,200));}
}

// ── 寫入 REC ──
function writeToRec(bill){
  const p=bill.parsed;if(!p)return;
  const yr=String(currentYear);
  // 從 endDate 取月份
  let month=1;
  if(p.endDate){const m=parseInt((p.endDate||'').slice(5,7));if(m>=1&&m<=12)month=m;}
  else if(p.startDate){const m=parseInt((p.startDate||'').slice(5,7));if(m>=1&&m<=12)month=m;}
  const mo=String(month);
  if(!REC[yr])REC[yr]={};
  if(!REC[yr][mo])REC[yr][mo]={electricity:[],refrigerant:[],fuel:[],septicTank:[]};

  if(p.billType==='electricity'){
    const kwh=parseFloat(p.kwh)||0;
    REC[yr][mo].electricity.push({
      id:bill.id,
      site:p.site||'汐止',
      meter:p.meter||'',
      kwh,
      amount:parseFloat(p.amount)||0,
      startDate:p.startDate||'',
      endDate:p.endDate||'',
      emission:calcElec(kwh,+yr),
      _evidence:{fileName:bill.fileName,scannedAt:bill.createdAt,address:p.address||''}
    });
  }
  // 水費單：目前存入備用結構（等水費模組）
  // 先存到 localStorage 備查
  const waterKey='ghg_water_'+yr;
  if(p.billType==='water'){
    try{
      const w=JSON.parse(localStorage.getItem(waterKey)||'[]');
      w.push({id:bill.id,site:p.site||'汐止',meter:p.meter||'',month,usage:parseFloat(p.usage)||0,amount:parseFloat(p.amount)||0,startDate:p.startDate||'',endDate:p.endDate||'',_evidence:{fileName:bill.fileName,scannedAt:bill.createdAt}});
      localStorage.setItem(waterKey,JSON.stringify(w));
    }catch{}
    // toast 提示
    setTimeout(()=>toast('水費單已存入備用區（水費模組待開發）','info'),100);
  }
}

// ── 刪除 ──
function deleteBill(id){
  BILLS=BILLS.filter(b=>b.id!==id);
  saveBills(BILLS);renderBillList();
  toast('已刪除','info');
}

// ── 清除已匯入 ──
function clearCommitted(){
  if(!confirm('確定要清除所有已匯入的佐證圖片？\n（資料不會被刪除，只清除圖片）'))return;
  BILLS=BILLS.filter(b=>b.status!=='committed');
  // 已匯入的只保留 metadata，清除 base64
  BILLS.forEach(b=>{if(b.status==='committed')b.imageBase64=null;});
  saveBills(BILLS);renderBillList();
  toast('已清除佐證圖片');
}

// ── 測試 API ──
async function testApiKey(){
  const key=document.getElementById('apiKeyInput')?.value||localStorage.getItem('ghg_api_key')||'';
  const el=document.getElementById('apiStatus');
  if(!key){if(el)el.textContent='請先填入 API Key';return;}
  if(el)el.textContent='測試中...';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:10,messages:[{role:'user',content:'hi'}]})});
    const d=await r.json();
    if(el)el.innerHTML=r.ok?'<span style="color:#276749">✅ 連線成功！可以開始掃描帳單</span>':'<span style="color:#C53030">❌ 錯誤：'+(d.error?.message||r.status)+'</span>';
  }catch(e){if(el)el.innerHTML='<span style="color:#C53030">❌ 網路錯誤：'+esc(e.message)+'</span>';}
}

// ── 編輯帳單解析結果 ──
function editBill(id){
  const b=BILLS.find(x=>x.id===id);if(!b||!b.parsed)return;
  const p=b.parsed;
  const site=prompt('場域（汐止/南港）：',p.site||'汐止');if(site===null)return;
  const meter=prompt('電號/水號：',p.meter||'');if(meter===null)return;
  const kwh=prompt('用電度數（電費單）：',p.kwh||'');if(kwh===null)return;
  const amount=prompt('金額：',p.amount||'');if(amount===null)return;
  const startDate=prompt('起始日（YYYY-MM-DD）：',p.startDate||'');if(startDate===null)return;
  const endDate=prompt('結束日（YYYY-MM-DD）：',p.endDate||'');if(endDate===null)return;
  b.parsed={...p,site,meter,kwh:parseFloat(kwh)||p.kwh,amount:parseFloat(amount)||p.amount,startDate,endDate};
  saveBills(BILLS);renderBillList();
  toast('已更新解析結果');
}

// Init
renderNav();
renderMain();
</script>
